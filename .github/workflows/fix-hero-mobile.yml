name: Fix hero image mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force mobile hero image to stay fully covered
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the JS parallax transform that was moving the image element and exposing blank space.
          s = re.sub(
              r"const heroBg=\$\('heroBg'\);.*?updateHeroParallax\(\);",
              "const heroBg=$('heroBg');",
              s,
              count=1,
              flags=re.S
          )

          marker = '/* FINAL_MOBILE_HERO_FIX */'
          if marker not in s:
              s += '''\n<style>\n/* FINAL_MOBILE_HERO_FIX */\n.hero-bg{\n  transform:none!important;\n}\n@media (max-width:750px){\n  .hero{\n    min-height:720px!important;\n    height:720px!important;\n    padding:0 7%!important;\n    box-sizing:border-box!important;\n    position:relative!important;\n    overflow:hidden!important;\n    background:#dfeceb!important;\n  }\n  .hero-bg{\n    position:absolute!important;\n    top:-12%!important;\n    right:-12%!important;\n    bottom:-12%!important;\n    left:-12%!important;\n    width:auto!important;\n    height:auto!important;\n    background-size:cover!important;\n    background-position:center center!important;\n    background-repeat:no-repeat!important;\n    transform:none!important;\n    animation:heroMobileZoom 10s ease-in-out infinite alternate!important;\n    will-change:transform!important;\n  }\n  .hero-bg::after{\n    content:''!important;\n    position:absolute!important;\n    inset:0!important;\n    background:linear-gradient(90deg,rgba(255,255,255,.93) 0%,rgba(255,255,255,.70) 42%,rgba(255,255,255,.18) 100%)!important;\n    pointer-events:none!important;\n  }\n  .hero-inner{\n    position:relative!important;\n    z-index:2!important;\n    width:100%!important;\n  }\n}\n@keyframes heroMobileZoom{\n  from{transform:scale(1.02);}\n  to{transform:scale(1.08);}\n}\n</style>\n'''
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit direct mobile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Force mobile hero image fix [skip ci]"
          git push
