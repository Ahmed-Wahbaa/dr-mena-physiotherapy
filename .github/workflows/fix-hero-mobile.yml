name: Fix hero image mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero image sizing on mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '@media(max-width:750px){.hero{min-height:720px!important;padding:0 7%!important;align-items:center!important}.hero-bg{inset:0!important;background-size:cover!important;background-position:center center!important}'
          new = '@media(max-width:750px){.hero{min-height:720px!important;padding:0 7%!important;align-items:center!important}.hero-bg{inset:0!important;background-size:auto 100%!important;background-position:center top!important;background-repeat:no-repeat!important}'
          if old in s:
              s = s.replace(old, new, 1)
          else:
              s += '\n<style>@media(max-width:750px){.hero-bg{background-size:auto 100%!important;background-position:center top!important;background-repeat:no-repeat!important}}</style>\n'
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix full hero photo on mobile [skip ci]"
          git push
