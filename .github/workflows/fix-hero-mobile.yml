name: Fix hero image mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero background CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = '''\n.hero-bg{inset:0!important;width:100%;height:100%;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important;}\n@media(max-width:750px){.hero{min-height:720px!important;padding:0 7%!important;align-items:center!important}.hero-bg{inset:0!important;background-size:cover!important;background-position:center center!important}.hero-content{position:relative;z-index:1;max-width:100%;}.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.92),rgba(255,255,255,.58));pointer-events:none;}}\n'''
          if '.hero-bg{inset:0!important' not in s:
              s = s.replace(marker, css + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix hero image sizing on mobile [skip ci]"
          git push