name: Fix hero image mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile hero image clipping and parallax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The old parallax moved the entire background element downward while scrolling,
          # which exposed the hero's gray background at the bottom on mobile.
          old_js = "const heroBg=$('heroBg');let ticking=false;function updateHeroParallax(){const y=Math.min(window.scrollY,900);heroBg.style.transform=`translate3d(0,${y*0.16}px,0) scale(1.06)`;ticking=false}window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(updateHeroParallax);ticking=true}},{passive:true});updateHeroParallax();"
          new_js = "const heroBg=$('heroBg');"
          if old_js in s:
              s = s.replace(old_js, new_js, 1)

          marker = '/* MOBILE_HERO_SCROLL_SAFE */'
          css = '''\n<style>\n/* MOBILE_HERO_SCROLL_SAFE */\n@media (max-width:750px){\n  .hero{\n    min-height:720px!important;\n    height:auto!important;\n    overflow:hidden!important;\n    position:relative!important;\n  }\n  .hero-bg{\n    inset:-6%!important;\n    width:auto!important;\n    height:auto!important;\n    background-size:cover!important;\n    background-position:center center!important;\n    background-repeat:no-repeat!important;\n    transform:none!important;\n    animation:mobileHeroBackground 14s ease-in-out infinite alternate!important;\n    will-change:background-position!important;\n  }\n  .hero-bg::after{\n    content:''!important;\n    position:absolute!important;\n    inset:0!important;\n    background:linear-gradient(90deg,rgba(255,255,255,.90) 0%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.15) 100%)!important;\n    pointer-events:none!important;\n  }\n  .hero-inner,.hero-content{position:relative!important;z-index:1!important;}\n}\n@keyframes mobileHeroBackground{\n  from{background-position:48% 50%;}\n  to{background-position:54% 50%;}\n}\n</style>\n'''
          if marker not in s:
              s += css
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix mobile hero image clipping [skip ci]"
          git push
