name: Fix hero image mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put hero image on the hero section itself
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove every old parallax script that changes heroBg transform on scroll.
          s = re.sub(
              r"const heroBg=\$\('heroBg'\);.*?updateHeroParallax\(\);",
              "const heroBg=$('heroBg');",
              s,
              count=1,
              flags=re.S
          )

          # Copy the existing hero image definition from .hero-bg to .hero.
          # This avoids any height/position problem caused by an absolutely positioned child.
          m = re.search(r"\.hero-bg\{.*?background-image:(.*?);", s, flags=re.S)
          if not m:
              raise SystemExit('Could not find the existing hero background image')
          image = m.group(1).strip()

          marker = '/* HERO_BACKGROUND_FINAL_FIX */'
          if marker not in s:
              s += f'''\n<style>\n/* HERO_BACKGROUND_FINAL_FIX */\n.hero{{\n  background-image:{image}!important;\n  background-size:cover!important;\n  background-position:center center!important;\n  background-repeat:no-repeat!important;\n  background-color:#dfeceb!important;\n}}\n.hero-bg{{\n  display:none!important;\n}}\n@media (max-width:750px){{\n  .hero{{\n    min-height:100svh!important;\n    height:auto!important;\n    padding:90px 7% 70px!important;\n    box-sizing:border-box!important;\n    position:relative!important;\n    overflow:hidden!important;\n    background-size:cover!important;\n    background-position:center center!important;\n    background-attachment:scroll!important;\n    animation:heroBackgroundMotion 12s ease-in-out infinite alternate!important;\n  }}\n  .hero::before{{\n    content:''!important;\n    position:absolute!important;\n    inset:0!important;\n    background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.68) 45%,rgba(255,255,255,.16) 100%)!important;\n    z-index:0!important;\n    pointer-events:none!important;\n  }}\n  .hero > *{{position:relative!important;z-index:1!important;}}\n}}\n@keyframes heroBackgroundMotion{{\n  from{{background-position:47% center;}}\n  to{{background-position:53% center;}}\n}}\n</style>\n'''
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit final mobile background fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix hero background filling mobile section [skip ci]"
          git push
