name: Fix hero image mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero image sizing on mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MOBILE_HERO_FULL_IMAGE_FIX */'
          css = '''\n<style>\n/* MOBILE_HERO_FULL_IMAGE_FIX */\n@media (max-width: 750px){\n  .hero{\n    min-height:100svh!important;\n    height:auto!important;\n    padding:0 7%!important;\n    box-sizing:border-box!important;\n    align-items:center!important;\n    position:relative!important;\n    overflow:hidden!important;\n  }\n  .hero-bg{\n    inset:0!important;\n    width:100%!important;\n    height:100%!important;\n    background-size:100% 100%!important;\n    background-position:center center!important;\n    background-repeat:no-repeat!important;\n    animation:heroImageMove 12s ease-in-out infinite alternate!important;\n    transform-origin:center center!important;\n  }\n  .hero-bg::after{\n    content:''!important;\n    position:absolute!important;\n    inset:0!important;\n    background:rgba(255,255,255,.20)!important;\n    pointer-events:none!important;\n  }\n  .hero > *:not(.hero-bg){position:relative!important;z-index:1!important;}\n}\n@keyframes heroImageMove{\n  from{transform:scale(1.01);}\n  to{transform:scale(1.06);}\n}\n</style>\n'''
          if marker not in s:
              s += css
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix full hero background image on mobile [skip ci]"
          git push
